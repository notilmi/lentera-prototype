<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LENTERA Bank — Menerangi Langkah Finansial Anda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Manrope:wght@700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- PUBLIC SHELL: Landing Page, Login & Register -->
    <div id="public-shell"></div>

    <!-- AUTHENTICATED M-BANKING APP SHELL -->
    <div id="app-shell" class="hidden">
      <div class="app-layout">
        <!-- DESKTOP LEFT SIDEBAR (Wise Web App Style) -->
        <aside class="app-sidebar" aria-label="Navigasi M-Banking">
          <div class="sidebar-top">
            <div class="sidebar-brand">
              <div class="logo-mark">
                <i data-lucide="sun" width="22" height="22"></i>
              </div>
              <div class="brand-wordmark">
                <span class="brand-name">LENTERA</span>
                <span class="brand-sub">M-Banking</span>
              </div>
            </div>

            <nav class="sidebar-nav">
              <button type="button" class="sidebar-nav-btn active" data-nav-route="home">
                <span class="sidebar-nav-left"><i data-lucide="home" width="18" height="18"></i> Beranda</span>
              </button>
              <button type="button" class="sidebar-nav-btn" data-nav-route="simpanan">
                <span class="sidebar-nav-left"><i data-lucide="wallet" width="18" height="18"></i> Simpanan</span>
              </button>
              <button type="button" class="sidebar-nav-btn" data-nav-route="transaksi">
                <span class="sidebar-nav-left"><i data-lucide="arrow-left-right" width="18" height="18"></i> Transaksi</span>
                <span class="nav-soon-tag">T3</span>
              </button>
              <button type="button" class="sidebar-nav-btn" data-nav-route="kredit">
                <span class="sidebar-nav-left"><i data-lucide="landmark" width="18" height="18"></i> Kredit</span>
                <span class="nav-soon-tag">T2</span>
              </button>
              <button type="button" class="sidebar-nav-btn" data-nav-route="riwayat">
                <span class="sidebar-nav-left"><i data-lucide="receipt-text" width="18" height="18"></i> Riwayat</span>
              </button>
              <button type="button" class="sidebar-nav-btn" data-nav-route="profil">
                <span class="sidebar-nav-left"><i data-lucide="user" width="18" height="18"></i> Profil & Bank</span>
              </button>
            </nav>
          </div>

          <div class="sidebar-bottom">
            <button type="button" class="btn btn-primary w-full" id="sidebar-quick-open-btn">
              <i data-lucide="plus" width="16" height="16"></i>
              Buka Simpanan
            </button>

            <button type="button" class="sidebar-user-chip" data-nav-route="profil">
              <span class="user-avatar-sm" id="sidebar-user-avatar">RP</span>
              <div>
                <strong id="sidebar-user-name">Raka Pratama</strong>
                <span id="sidebar-user-tier">Nasabah Terverifikasi</span>
              </div>
            </button>
          </div>
        </aside>

        <!-- MAIN APP WORKSPACE -->
        <div class="app-main">
          <header class="app-topbar">
            <div class="topbar-left">
              <button
                type="button"
                class="topbar-back-btn hidden"
                id="topbar-back-btn"
                aria-label="Kembali ke layar sebelumnya"
              >
                <i data-lucide="arrow-left" width="18" height="18"></i>
              </button>
              <div>
                <h1 class="topbar-title" id="topbar-title">Halo, Raka</h1>
                <p class="topbar-subtitle" id="topbar-subtitle">Ringkasan finansial LENTERA Bank Anda</p>
              </div>
            </div>

            <div class="topbar-right">
              <button type="button" class="icon-circle-btn" id="topbar-notif-btn" aria-label="Notifikasi">
                <i data-lucide="bell" width="18" height="18"></i>
                <span class="notif-dot"></span>
              </button>
              <button type="button" class="icon-circle-btn" data-nav-route="profil" aria-label="Profil">
                <i data-lucide="user" width="18" height="18"></i>
              </button>
            </div>
          </header>

          <main id="screen-outlet" class="screen-outlet"></main>
        </div>
      </div>

      <!-- MOBILE FIXED BOTTOM TAB BAR -->
      <nav class="mobile-bottom-nav" aria-label="Navigasi Mobile">
        <div class="bottom-nav-grid">
          <button type="button" class="bottom-nav-btn active" data-nav-route="home">
            <i data-lucide="home" width="18" height="18"></i>
            <span>Beranda</span>
          </button>
          <button type="button" class="bottom-nav-btn" data-nav-route="simpanan">
            <i data-lucide="wallet" width="18" height="18"></i>
            <span>Simpanan</span>
          </button>
          <button type="button" class="bottom-nav-btn" data-nav-route="transaksi">
            <i data-lucide="arrow-left-right" width="18" height="18"></i>
            <span>Transaksi</span>
          </button>
          <button type="button" class="bottom-nav-btn" data-nav-route="riwayat">
            <i data-lucide="receipt-text" width="18" height="18"></i>
            <span>Riwayat</span>
          </button>
          <button type="button" class="bottom-nav-btn" data-nav-route="profil">
            <i data-lucide="user" width="18" height="18"></i>
            <span>Profil</span>
          </button>
        </div>
      </nav>
    </div>

    <!-- SHARED APP MODAL / SHEET -->
    <div class="modal-overlay" id="app-modal" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="modal-card">
        <button type="button" class="modal-close-icon" id="modal-close-btn" aria-label="Tutup">
          <i data-lucide="x" width="18" height="18"></i>
        </button>
        <div class="modal-header-center">
          <div class="modal-check-circle">
            <i data-lucide="check" width="26" height="26"></i>
          </div>
          <span class="pill-badge" id="modal-badge">Berhasil</span>
          <h3 class="modal-title" id="modal-title">Pengajuan Diproses</h3>
          <p class="modal-subtitle" id="modal-subtitle"></p>
        </div>
        <div class="modal-body-details" id="modal-details"></div>
        <button type="button" class="btn btn-primary w-full" id="modal-cta-btn">Selesai</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
